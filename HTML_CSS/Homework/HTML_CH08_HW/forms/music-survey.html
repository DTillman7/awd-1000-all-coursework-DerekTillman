<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/music-styles.css">
  <title>Music Survey</title>
</head>
<body>
    <div id="container">
      <h2>Music Survey</h2>
       <label for="fname">First Name:</label>
      <input type="text" name="fName" id="fName">
      <br>
      <label for="email">E-mail:</label>
      <input type="email" name="email" id="email">

        <form class="grid">
         <fieldset>
            <legend>Select your favorite music genre</legend>
            <label>
            <input type="radio" name="interest" value="Rock Music">Rock
          </label>
            <br>

            <label>
            <input type="radio" name="interest" id="pop" value="Pop Music">Pop
          </label>
          <br>

            <label>
            <input type="radio" name="interest" id="hiphop" value="Hip Hop Music">Hip Hop
          </label>
          <br>

            <label>
            <input type="radio" name="interest" id="eletronic" value="Electronic Music">Electronic
          </label>
          <br>

          <label>
            <input type="radio" name="interest" id="jazz" value="Jazz Music">Jazz
          </label>
          <br>

          <label>
            <input type="radio" name="interest" id="classical" value="Classical Music">Classical
          </label>
          <br>

          <label >
            <input type="radio" name="interest" id="country" value="Country Music">Country
          </label>
          <br>

          <label >
            <input type="radio" name="interest" id="rb" value="R&B Music">R&amp;B
          </label>
          <br>

          <label>
            <input type="radio" name="interest" id="other" value="Other Music">Other
          </label>
         </fieldset>
          <br>
          
         <fieldset>
            <legend>Select what music services that you use (one or more)</legend>
            <label>
            <input type="checkbox" name="services" id="spotify" value="Spotify">Spotify
            </label>
            <br>

            <label>
            <input type="checkbox" name="apple" id="apple" value="Apple Music">Apple Music
            </label>
            <br>

            <label>
            <input type="checkbox" name="amazon" id="amazon" value="Amazon Music">Amazon Music
            </label>
            <br>

            <label>
            <input type="checkbox" name="youtube" id="youtube" value="YouTube Music">YouTube Music
            </label>
            <br>

            <label>
            <input type="checkbox" name="siriusXM" id="siriusXM" value="SiriusXM">SiriusXM
            </label>
            <br>

            <label>
            <input type="checkbox" name="tidal" id="tidal" value="Tidal">Tidal
            </label>
            <br>

            <label>
            <input type="checkbox" name="qobuz" id="qobuz" value="Qobuz">Qobuz
            </label>
            <br>

            <label>
            <input type="checkbox" name="pandora" id="pandora" value="Pandora">Pandora
            </label>
            <br>

            <label>
            <input type="checkbox" name="ihearthadio" id="iheart" value="iHeartRadio">iHeartRadio
            </label>
            <br>

            <label>
            <input type="checkbox" name="deezer" id="deezer" value="Deezer">Deezer
            </label>
            <br>

            <label>
            <input type="checkbox" name="soundcloud" id="soundcloud" value="SoundCloud">SoundCloud
            </label>
            <br>

            <label>
            <input type="checkbox" name="serviceother" id="serviceother" value="Other Music Services">Other Music
            </label>
          </fieldset>
          <br>

            <label>What does music do for you?</label>
            <br>
            <select name="mood" id="mood" size="3">
              <option value="relax">Relax</option>
              <option value="motivate">Motivate</option>
              <option value="focus">Focus</option>
              <option value="reflect">Reflect</option>
            </select>
            <br>

          <h3>What's your favorite song and what does it mean to you?</h3>
          <br>
          <textarea cols="50" rows="4" maxlength="50">
          </textarea>

          <button type="submit" id="submit" value="Submit" class="btn">Submit</button>
          <button type="reset" value="Reset" id="reset" class="btn">Reset</button>
      </form>
    </div>
  <footer>
   <!--- <button type="submit" id="submit" value="Submit" class="btn">Submit</button>
    <button type="reset" id="reset" value="Reset" class="btn">Reset</button> -->
  </footer>
</body>
</html>
