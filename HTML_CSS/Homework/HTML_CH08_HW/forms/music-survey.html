<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/music-styles.css">
  <title>Music Survey</title>
</head>
<body>
    <div>
      <div id="container">
      <h2>Music Survey</h2>
      <form method="post">
        <fieldset>
            <label for="fname">First Name:</label>
            <input type="text" name="fName" id="fName">
          <br>
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email">
        </fieldset>

        <form class="grid" method="post">
         <fieldset>
            <legend>Select your favorite music genre</legend>
            <label for="rockmusic">
            <input type="radio" name="interest" id="rockmusic" value="Rock Music">Rock
          </label>
            <br>

            <label for="pop">
            <input type="radio" name="interest" id="pop" value="Pop Music">Pop
          </label>
          <br>

            <label for="HipHop">
            <input type="radio" name="interest" id="HipHop" value="Hip Hop Music">Hip Hop
          </label>
          <br>

            <label for="eletronic">
            <input type="radio" name="interest" id="eletronic" value="Electronic Music">Electronic
          </label>
          <br>

          <label for="jazz">
            <input type="radio" name="interest" id="jazz" value="Jazz Music">Jazz
          </label>
          <br>

          <label for="classical">
            <input type="radio" name="interest" id="classical" value="Classical Music">Classical
          </label>
          <br>

          <label for="country">
            <input type="radio" name="interest" id="country" value="Country Music">Country
          </label>
          <br>

          <label for="r&b">
            <input type="radio" name="interest" value="R&B Music">R&B
          </label>
          <br>
          
          <label for="other">
            <input type="radio" name="interest" id="other" value="Other Music">Other
          </label>
         </fieldset>
        </form>

        <form class="grid" method="post">
         <fieldset>
            <legend>Select what music services that you use (one or more)</legend>
            <label for="spotify">
            <input type="checkbox" name="services" id="spotify" value="Spotify">Spotify
            </label>
            <br>

            <label for="apple">
            <input type="checkbox" name="services" id="apple" value="Apple Music">Apple Music
            </label>
            <br>

            <label for="amazon">
            <input type="checkbox" name="services" id="amazon" value="Amazon Music">Amazon Music
            </label>
            <br>

            <label for="youtube">
            <input type="checkbox" name="services" id="youtube" value="YouTube Music">YouTube Music
            </label>
            <br>

            <label for="siriusXM">
            <input type="checkbox" name="services" id="siriusXM" value="SiriusXM">SiriusXM
            </label>
            <br>

            <label for="tidal">
            <input type="checkbox" name="services" id="tidal" value="Tidal">Tidal
            </label>
            <br>

            <label for="qobuz">
            <input type="checkbox" name="services" id="qobuobuz" value="Qobuz">Qobuz
            </label>
            <br>

            <label for="pandora">
            <input type="checkbox" name="services" id="pandora" value="Pandora">Pandora
            </label>
            <br>

            <label for="iheart">
            <input type="checkbox" name="services" id="iheart" value="iHeartRadio">iHeartRadio
            </label>
            <br>

            <label for="deezer">
            <input type="checkbox" name="services" id="deezer" value="Deezer">Deezer
            </label>
            <br>

            <label for="soundcloud">
            <input type="checkbox" name="services" id="soundcloud" value="SoundCloud">SoundCloud
            </label>
            <br>

            <label for="other">
            <input type="checkbox" name="services" id="other" value="Other Music Services">Other Music
            </label>
          </fieldset>
        </form>

        <form class="grid" method="post">
          <label>
            <label for="mood">What does music do for you?</label>
            <fieldset>
            <select name="mood" id="mood">
              <option value="relax">Relax</option>
              <option value="motivate">Motivate</option>
              <option value="focus">Focus</option>
              <option value="reflect">Reflect</option>
            </select>
            </fieldset>
          </label>
          <br>

          <h3>What's your favorite song and what does it mean to you?</h3>
          <br>
          <textarea cols="50" rows="4" maxlength="50">
          </textarea>

          <button type="submit" id="submit" value="Submit" class="btn">Submit</button>
          <button type="reset" value="Reset" id="reset" class="btn">Reset</button>
        <!--<button type="reset" id="reset" value="Reset" class="btn">Reset</button>-->
      </form>
    </div>
  <footer>
   <!--- <button type="submit" id="submit" value="Submit" class="btn">Submit</button>
    <button type="reset" id="reset" value="Reset" class="btn">Reset</button> -->
  </footer>
</body>
</html>
